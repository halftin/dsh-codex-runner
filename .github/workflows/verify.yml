name: Verify package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.19.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Offline tests use Node built-ins and a host UI stub. No model credentials.
      - run: npm run verify
        # Avoid Windows 8.3 temp aliases in watchers and path-sensitive fixtures.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm pack --pack-destination "${{ runner.temp }}"
      - name: Check the packed runtime
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'runner-unpacked'
          New-Item -ItemType Directory -Path $out | Out-Null
          $archive = Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'dsh-codex-runner-*.tgz' | Select-Object -First 1
          tar -xzf $archive.FullName -C $out
          # The checker stays in the source checkout; it inspects the actual archive.
          node scripts/check-package.mjs (Join-Path $out 'package')
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: ${{ runner.temp }}/dsh-codex-runner-*.tgz
